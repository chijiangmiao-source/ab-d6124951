# 宏卫生展开复核台 — Compose 编排
#
# 宿主端口可配置：  HOST_PORT=9090 docker compose up --build
# 默认 8080。
#
# 一次性验收：      docker compose up --build verify   （退出码即验收结论）
# 规程页面：        http://localhost:${HOST_PORT:-8080}/
# 健康响应：        http://localhost:${HOST_PORT:-8080}/health

services:
  web:
    build: .
    image: macro-hygiene-review:latest
    environment:
      PORT: "8080"
    ports:
      # 容器内固定 8080，宿主端口由 HOST_PORT 配置
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3); sys.exit(0 if json.load(r)['status']=='ok' else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 1s
    restart: unless-stopped

  verify:
    build: .
    image: macro-hygiene-review:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: "http://web:8080"
    entrypoint: ["python", "/srv/verify.py"]
    restart: "no"
    profiles: ["verify"]
